<button type="button" id="chatFab" class="chat-fab" aria-expanded="false" aria-controls="chat" aria-label="Ask about me"><img src="/assets/avatar.webp" width="240" height="240" alt=""><i class="live" aria-hidden="true"></i><span class="lbl">Ask about me</span></button>
<section id="chat" class="chat" data-lenis-prevent role="dialog" aria-label="Ask about Hariswara">
  <div class="chat-head"><img src="/assets/avatar.webp" width="240" height="240" alt=""><div><b>Ask about Hariswara</b><span>Answers from his portfolio</span></div><button type="button" class="chat-new" id="chatNew">New chat</button><button type="button" class="icon-btn" id="chatX" aria-label="Close chat"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <div id="chatLog" aria-live="polite"></div>

  <form id="chatForm"><input type="text" enterkeyhint="send" id="chatInput" maxlength="300" placeholder="Ask anything, even the silly stuff" autocomplete="off" aria-label="Your question"><button type="submit" aria-label="Send"><svg class="ico"><use href="#i-paper-plane-tilt"/></svg></button></form>
</section>
